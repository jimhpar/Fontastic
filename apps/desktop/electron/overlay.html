<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fontastic Screen Viewfinder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .top-toolbar {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      pointer-events: auto;
    }
    .cancel-btn {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .cancel-btn:hover {
      background: #dc2626;
    }
    .pill {
      background: #2563eb;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="top-toolbar">
    <span class="pill">VIEWFINDER ACTIVE</span>
    <span>Click and drag over any text on your screen</span>
    <button class="cancel-btn" id="cancelBtn">✕ Cancel (Esc)</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cancelBtn = document.getElementById('cancelBtn');

    let screenImg = new Image();
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    }
    window.addEventListener('resize', resize);

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (screenImg.complete && screenImg.naturalWidth > 0) {
        ctx.drawImage(screenImg, 0, 0, canvas.width, canvas.height);
      }

      // Draw dark overlay over entire screen
      ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isDrawing || (startX !== currentX && startY !== currentY)) {
        const x = Math.min(startX, currentX);
        const y = Math.min(startY, currentY);
        const w = Math.abs(currentX - startX);
        const h = Math.abs(currentY - startY);

        if (w > 0 && h > 0) {
          // Clear overlay inside selection box to show crisp, bright text
          if (screenImg.complete && screenImg.naturalWidth > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.clip();
            ctx.drawImage(screenImg, 0, 0, canvas.width, canvas.height);
            ctx.restore();
          }

          // Draw selection border
          ctx.strokeStyle = '#2563eb';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, w, h);

          // Draw size label badge
          const label = `${w} × ${h}`;
          ctx.font = 'bold 12px sans-serif';
          const textWidth = ctx.measureText(label).width;
          ctx.fillStyle = '#2563eb';
          ctx.fillRect(x, Math.max(0, y - 24), textWidth + 12, 20);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(label, x + 6, Math.max(14, y - 10));
        }
      }
    }

    if (window.overlayAPI) {
      window.overlayAPI.onSetScreenImage((dataUrl) => {
        screenImg = new Image();
        screenImg.onload = () => {
          resize();
        };
        screenImg.src = dataUrl;
      });
    }

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('.top-toolbar')) return;
      isDrawing = true;
      startX = e.clientX;
      startY = e.clientY;
      currentX = e.clientX;
      currentY = e.clientY;
      draw();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      currentX = e.clientX;
      currentY = e.clientY;
      draw();
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const w = Math.abs(currentX - startX);
      const h = Math.abs(currentY - startY);

      // Only finish if area is larger than 15x15 pixels
      if (w > 15 && h > 15) {
        // Crop region from original screen image
        const cropCanvas = document.createElement('canvas');
        const scaleX = screenImg.naturalWidth / canvas.width;
        const scaleY = screenImg.naturalHeight / canvas.height;

        cropCanvas.width = w * scaleX;
        cropCanvas.height = h * scaleY;
        const cropCtx = cropCanvas.getContext('2d');

        cropCtx.drawImage(
          screenImg,
          x * scaleX, y * scaleY, w * scaleX, h * scaleY,
          0, 0, cropCanvas.width, cropCanvas.height
        );

        const croppedDataUrl = cropCanvas.toDataURL('image/png');
        if (window.overlayAPI) {
          window.overlayAPI.sendSnipCompleted(croppedDataUrl);
        }
      } else {
        draw();
      }
    });

    // Handle Escape key or Cancel button
    function cancel() {
      if (window.overlayAPI) {
        window.overlayAPI.cancelSnip();
      }
    }

    cancelBtn.addEventListener('click', cancel);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        cancel();
      }
    });
  </script>
</body>
</html>
